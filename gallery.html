<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render gallery — Blender scenes</title>
<style>
  :root {
    --bg:#f6f6f4; --panel:#fff; --ink:#1b2028; --muted:#5c6470; --rule:#dcdcd6;
    --accent:#2f6f4f; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1216; --panel:#171b21; --ink:#e8e9ea; --muted:#9aa3ae; --rule:#2a3039; --accent:#7fd0a3;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1216; --panel:#171b21; --ink:#e8e9ea; --muted:#9aa3ae; --rule:#2a3039; --accent:#7fd0a3;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         padding:0 0 5rem; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 1.25rem; }
  header { border-bottom:1px solid var(--rule); padding:2.5rem 0 1.25rem; margin-bottom:1.5rem; }
  h1 { font-size:clamp(1.5rem,4vw,2.2rem); margin:0 0 .4rem; letter-spacing:-.02em; }
  .sub { color:var(--muted); margin:0 0 1rem; max-width:66ch; }

  nav.tabs { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.25rem; }
  nav.tabs button {
    font:600 13px/1 var(--mono); padding:.6rem .9rem; cursor:pointer;
    border:1px solid var(--rule); border-radius:7px; background:var(--panel); color:var(--muted);
  }
  nav.tabs button[aria-selected="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  nav.tabs button:hover { color:var(--ink); }

  .facts { display:flex; flex-wrap:wrap; gap:.5rem; margin:1.25rem 0 0; }
  .fact { font:12px/1 var(--mono); padding:.45rem .6rem; border:1px solid var(--rule);
          border-radius:5px; color:var(--muted); background:var(--panel); }
  .fact b { color:var(--accent); font-weight:600; }

  figure { margin:0 0 3rem; background:var(--panel); border:1px solid var(--rule);
           border-radius:10px; overflow:hidden; }
  figure img { display:block; width:100%; height:auto; background:#222; }
  figcaption { padding:1.1rem 1.25rem 1.25rem; border-top:1px solid var(--rule); }
  .name { font:600 13px/1 var(--mono); color:var(--accent); text-transform:uppercase;
          letter-spacing:.08em; margin-bottom:.45rem; }
  .what { margin:0 0 .5rem; }
  .why { margin:0; color:var(--muted); font-size:.92rem; }
  .why b { color:var(--ink); font-weight:600; }
  a { color:var(--accent); }
  .note { color:var(--muted); font-size:.9rem; }
  code { font:13px var(--mono); color:var(--accent); }
  .run { background:var(--panel); border:1px solid var(--rule); border-radius:8px;
         padding:.7rem .85rem; font:12.5px var(--mono); overflow-x:auto; margin:1.5rem 0 2rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Render gallery</h1>
    <p class="sub">
      Scenes built procedurally and path traced in Cycles. Each is also
      <a href="viewer.html">interactive</a>, and its
      <a href="pipeline.html">build pipeline is documented</a>.
    </p>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="main"></main>
</div>

<script src="demos.js"></script>
<script>
const tabs = document.getElementById('tabs');
const main = document.getElementById('main');

function render(demo) {
  main.innerHTML = '';

  const intro = document.createElement('p');
  intro.className = 'sub';
  intro.innerHTML = demo.tagline;
  main.append(intro);

  const facts = document.createElement('div');
  facts.className = 'facts';
  for (const [k, v] of demo.facts) {
    const s = document.createElement('span');
    s.className = 'fact';
    s.innerHTML = k + ' <b>' + v + '</b>';
    facts.append(s);
  }
  main.append(facts);

  const run = document.createElement('div');
  run.className = 'run';
  run.textContent = demo.run;
  main.append(run);

  for (const s of demo.stills) {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = s.file;
    img.alt = s.alt;
    img.loading = 'lazy';
    const cap = document.createElement('figcaption');
    cap.innerHTML =
      '<div class="name">' + s.name + '</div>' +
      '<p class="what">' + s.what + '</p>' +
      '<p class="why">' + s.why + '</p>';
    fig.append(img, cap);
    main.append(fig);
  }

  const foot = document.createElement('p');
  foot.className = 'note';
  foot.innerHTML =
    'See this scene <a href="viewer.html#' + demo.id + '">interactively</a> ' +
    '(orbit and zoom, with the light transport left behind), or read its ' +
    '<a href="pipeline.html#' + demo.id + '">build pipeline</a>.';
  main.append(foot);
}

function select(id) {
  const demo = window.DEMOS.find(d => d.id === id) || window.DEMOS[0];
  for (const b of tabs.children) b.setAttribute('aria-selected', String(b.dataset.id === demo.id));
  render(demo);
  if (location.hash.slice(1) !== demo.id) history.replaceState(null, '', '#' + demo.id);
}

for (const d of window.DEMOS) {
  const b = document.createElement('button');
  b.textContent = d.title;
  b.dataset.id = d.id;
  b.setAttribute('role', 'tab');
  b.onclick = () => select(d.id);
  tabs.append(b);
}
select(location.hash.slice(1) || window.DEMOS[0].id);
addEventListener('hashchange', () => select(location.hash.slice(1)));
</script>
</body>
</html>
