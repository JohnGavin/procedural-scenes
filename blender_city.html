<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blender city — interactive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb2d4; }
  canvas { display: block; }

  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1d2733; background: rgba(255,255,255,.78);
    backdrop-filter: blur(6px);
    padding: 10px 12px; border-radius: 8px; max-width: 330px;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
  }
  #hud h1 { font-size: 13px; margin: 0 0 6px; letter-spacing: .01em; }
  #hud p { margin: 0 0 8px; color: #47525f; }
  #hud .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  button {
    font: inherit; font-size: 12px; padding: 5px 9px; cursor: pointer;
    border: 1px solid #b9c2cc; border-radius: 5px; background: #fff; color: #1d2733;
  }
  button[aria-pressed="true"] { background: #1d2733; color: #fff; border-color: #1d2733; }
  button:hover { border-color: #6f7b88; }
  #stat { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #5c6470; }
  #err { color: #8a1c1c; font-size: 12px; }
  a { color: #235e42; }
</style>
</head>
<body>

<div id="hud">
  <h1>Blender city — interactive</h1>
  <p>
    The Blender-built city exported to glTF, running in three.js.
    <b>Drag</b> to orbit · <b>scroll</b> to zoom · <b>right-drag</b> to pan.
  </p>
  <div class="row">
    <button id="b-day"   aria-pressed="true">Day</button>
    <button id="b-night" aria-pressed="false">Night</button>
    <button id="b-spin"  aria-pressed="false">Auto-orbit</button>
    <button id="b-reset">Reset view</button>
  </div>
  <div id="stat">loading…</div>
  <div id="err"></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { Sky }           from 'three/addons/objects/Sky.js';

const statEl = document.getElementById('stat');
const errEl  = document.getElementById('err');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02;   // never drop below the ground

// Home view, matching the framing of the noon still.
const HOME = { pos: new THREE.Vector3(215, 135, 235), target: new THREE.Vector3(0, 14, 0) };
function resetView() {
  camera.position.copy(HOME.pos);
  controls.target.copy(HOME.target);
  controls.update();
}
resetView();

// ---- sky + lights ---------------------------------------------------------
// The glTF carries geometry and materials, not the renderer. Cycles' sky, its
// volumetric atmosphere and every bounce of GI stay behind in Blender; what a
// rasteriser can do is a sky dome, a directional sun and an ambient fill.
const sky = new Sky();
sky.scale.setScalar(45000);
scene.add(sky);

const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const S = 260;
Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 1, far: 1400 });
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0xbfd4ea, 0x4a4a3f, 0.9);
scene.add(hemi);

function applyMood(night) {
  const elevation = night ? -4 : 34;
  const azimuth   = 128;
  const phi   = THREE.MathUtils.degToRad(90 - elevation);
  const theta = THREE.MathUtils.degToRad(azimuth);
  const dir = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);

  const u = sky.material.uniforms;
  u.sunPosition.value.copy(dir);
  u.turbidity.value      = night ? 6 : 4;
  u.rayleigh.value       = night ? 0.6 : 2.2;
  u.mieCoefficient.value = 0.005;
  u.mieDirectionalG.value = 0.8;

  sun.position.copy(dir).multiplyScalar(600);
  sun.target.position.set(0, 0, 0);
  sun.intensity = night ? 0.05 : 2.4;
  sun.color.set(night ? 0x8fa8d0 : 0xfff4e0);

  hemi.intensity = night ? 0.12 : 0.9;
  renderer.toneMappingExposure = night ? 0.75 : 1.0;
  scene.background = null;
}

// ---- model ----------------------------------------------------------------
const loader = new GLTFLoader();
let current = null;
const cache = new Map();

function prepare(root, night) {
  root.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (!m) continue;
      // Blender's glass exports as a low-opacity PBR material; without this the
      // towers read as solid blocks. This is an approximation of transmission,
      // not the real thing — that is exactly what stays behind in Cycles.
      if (m.transmission > 0 || (m.opacity !== undefined && m.opacity < 1)) {
        m.transparent = true;
        m.depthWrite = false;
      }
      // Emissive windows: in Cycles these illuminate the city. Here they can
      // only glow — a rasteriser's emissive surface lights nothing but itself.
      if (m.emissive && m.emissive.getHex() !== 0x000000) {
        m.emissiveIntensity = night ? 2.6 : 0.15;
      }
    }
  });
}

function load(name, night) {
  errEl.textContent = '';
  statEl.textContent = 'loading ' + name + '…';
  if (cache.has(name)) {
    swap(cache.get(name), night, name);
    return;
  }
  loader.load(
    './renders/' + name,
    gltf => {
      const root = gltf.scene;
      // Blender exports its own camera; we drive our own.
      root.traverse(o => { if (o.isCamera) o.visible = false; });
      cache.set(name, root);
      swap(root, night, name);
    },
    xhr => { if (xhr.total) statEl.textContent = 'loading ' + Math.round(100 * xhr.loaded / xhr.total) + '%'; },
    e => {
      errEl.textContent = 'Could not load ./renders/' + name +
        ' — export it first (see below), and note that file:// may block it in some browsers.';
      statEl.textContent = '';
      console.error(e);
    }
  );
}

function swap(root, night, name) {
  if (current) scene.remove(current);
  prepare(root, night);
  scene.add(root);
  current = root;

  let meshes = 0, tris = 0;
  root.traverse(o => {
    if (!o.isMesh) return;
    meshes++;
    const g = o.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  statEl.textContent =
    `${name} · ${meshes} meshes · ${Math.round(tris).toLocaleString()} triangles`;
}

// ---- ui -------------------------------------------------------------------
const bDay = document.getElementById('b-day');
const bNight = document.getElementById('b-night');
const bSpin = document.getElementById('b-spin');

let night = false;
function setMood(n) {
  night = n;
  bDay.setAttribute('aria-pressed', String(!n));
  bNight.setAttribute('aria-pressed', String(n));
  applyMood(n);
  load(n ? 'city_night.glb' : 'city_day.glb', n);
}
bDay.onclick   = () => setMood(false);
bNight.onclick = () => setMood(true);
bSpin.onclick  = () => {
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 0.5;
  bSpin.setAttribute('aria-pressed', String(controls.autoRotate));
};
document.getElementById('b-reset').onclick = resetView;

setMood(false);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
